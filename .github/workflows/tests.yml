name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

      # Ninja needs the MSVC environment on Windows to find cl.exe.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # setup-uv already provisions and activates .venv when python-version
      # is set, so installing into it directly is all that is needed.
      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # The network flag unskips the end-to-end dependency tests, which
      # download and compile a real third-party package (fmt).
      - name: Test
        run: uv run --with pytest-cov pytest --cov --cov-branch --cov-report=xml
        env:
          CMAKELESS_NETWORK_TESTS: "1"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  examples:
    name: examples / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # Builds every examples/ project from its real cmakelessfile.py. Run on
      # one Python version only: these exercise CMake and the compiler, not
      # the interpreter, so the matrix that matters here is the operating
      # system.
      - name: Build every example
        run: uv run pytest -m integration tests/integration
        # The runner's bundled LLVM can lag the Visual Studio STL, which refuses
        # older Clang (STL1000); Microsoft's documented override keeps clang-cl
        # and clang-tidy usable until the image catches up.
        env:
          CMAKELESS_NETWORK_TESTS: "1"
          CXXFLAGS: ${{ runner.os == 'Windows' && '-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH' || '' }}

  # Flag syntax and linker families are only visible with more than one
  # compiler per platform (clang-cl speaks cl's command line), and the
  # emitted floors are only proven by building against the floors themselves.
  toolchains:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cmake 3.25 (floor) / gcc
            os: ubuntu-latest
            cmake: "3.25.3"
            cc: gcc
            cxx: g++
          - name: cmake 3.28 (modules floor) / clang
            os: ubuntu-latest
            cmake: "3.28.6"
            cc: clang
            cxx: clang++
          - name: cmake latest / clang
            os: ubuntu-latest
            cmake: "latest"
            cc: clang
            cxx: clang++
          - name: cmake latest / clang-cl
            os: windows-latest
            cmake: "latest"
            cc: clang-cl
            cxx: clang-cl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install CMake ${{ matrix.cmake }}
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # latest
        with:
          cmakeVersion: ${{ matrix.cmake }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Build every example with this toolchain
        run: uv run pytest -m integration tests/integration
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKELESS_NETWORK_TESTS: "1"
          CXXFLAGS: ${{ runner.os == 'Windows' && '-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH' || '' }}
